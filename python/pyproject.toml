[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelviz"
version = "0.1.0"
description = "AI-powered experiment tracking and visualization for ML research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Model Viz", email = "viz@example.com" }
]
keywords = ["machine-learning", "visualization", "experiment-tracking", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
full = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "matplotlib>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/example/modelviz"
Documentation = "https://github.com/example/modelviz#readme"

[tool.hatch.build.targets.wheel]
packages = ["modelviz"]
